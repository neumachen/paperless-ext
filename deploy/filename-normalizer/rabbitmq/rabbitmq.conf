# File Normalizer broker configuration.
#
# Single node. RabbitMQ clustering is not a requirement for this increment;
# durability comes from durable exchanges, quorum queues and persistent
# messages, which survive a restart of this node.

listeners.tcp.default = 5672
management.tcp.port = 15672

# Refuse to accept publishes once memory or disk pressure is reached, rather
# than letting the node fall over. Intake stops before capacity exhaustion.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 256MB

# Quorum queues are the default type so a queue declared without arguments is
# still durable and replicated-capable.
default_queue_type = quorum

log.console = true
log.console.level = info
log.file = false

# Loopback restriction stays on: the project user is a named account created
# from the project's .env file, and no host port is published for AMQP.
loopback_users.guest = true
