# File Normalizer — alert rules.
#
# RECEIVERS ARE UNRESOLVED. No notification target has been supplied, so every
# rule below routes nowhere until an operator sets one. They are written
# against metrics the applications already export; nothing here needs new
# instrumentation.
#
# Each rule states the operator action, because an alert nobody knows what to
# do with is noise. Severities: `page` means a document pipeline is stopped or
# a document needs a person; `ticket` means attention within a working day.
groups:
  - name: filename-normalizer
    rules:
      # --- the pipeline is not running -------------------------------------
      - alert: FnWatcherAbsent
        expr: absent(fn_build_info{application="watcher"}) == 1
        for: 5m
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "No watcher is reporting"
          action: >-
            Exactly one watcher must run. Start it, then confirm fn_build_info
            reappears and the oldest pending-dispatch age falls.

      - alert: FnNoRenamerReporting
        expr: absent(fn_build_info{application="renamer"}) == 1
        for: 5m
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "No renamer is reporting"
          description: >-
            Work is registered and dispatched but nothing is processing it.
            Previously uncovered: the consumer rule below cannot fire for an
            instance that is not there to export a metric.
          action: "Start at least one renamer."

      - alert: FnRenamerNotConsuming
        # Restricted to renamers on purpose. A HEALTHY WATCHER EXPORTS
        # fn_consumer_up 0 -- it is not a broker consumer -- so the unqualified
        # form paged on a working system. The join carries `application`, which
        # fn_consumer_up itself does not have.
        expr: (fn_consumer_up == 0) and on(instance) (fn_build_info{application="renamer"} == 1)
        for: 5m
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "A renamer is up but holds no consumer on the work queue"
          action: >-
            Check broker connectivity and credentials for that instance. A
            restart re-attaches the consumer.

      - alert: FnRequiredDependencyDown
        # The replica is optional (FN_DB_REPLICA_REQUIRED defaults false), so
        # an unconfigured or absent one must not page.
        expr: fn_dependency_up{dependency!="postgres_replica"} == 0
        for: 3m
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "A required dependency is unavailable ({{ $labels.dependency }})"
          action: >-
            Restore it. The applications hold work rather than inventing
            outcomes, so nothing is lost while it is down.

      - alert: FnReplicaDown
        expr: fn_dependency_up{dependency="postgres_replica"} == 0
        for: 30m
        labels: {severity: ticket, receiver: UNRESOLVED}
        annotations:
          summary: "The optional PostgreSQL replica is not answering"
          action: >-
            Only a ticket: the replica is read-only and optional. Ignore this
            rule entirely if you run without one.

      - alert: FnStorageUnavailable
        expr: fn_storage_root_available == 0
        for: 2m
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "A storage root is unavailable ({{ $labels.role }})"
          description: >-
            Unavailable storage is never treated as an empty directory.
          action: "Check the mount before restarting anything."

      # --- work is arriving but not moving ---------------------------------
      - alert: FnDiscoveryStalled
        expr: time() - fn_discovery_last_run_timestamp_seconds > 900
        for: 5m
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "Discovery has not completed a pass in 15 minutes"
          description: >-
            The watcher process can be alive and healthy while discovery is
            not running. Previously uncovered.
          action: "Check the watcher's logs for a stuck or failing pass."

      - alert: FnBacklogStalled
        expr: fn_oldest_pending_dispatch_age_seconds > 1800
        for: 10m
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "The oldest job owing a broker publication is over 30 minutes old"
          action: "Check that the broker is reachable and the queue is draining."

      - alert: FnPendingDispatchGrowing
        # `pending` is not a ledger state. The states are pending_dispatch,
        # dispatching, dispatched, processing, publishing, delivered, held,
        # uncertain -- the earlier rule named one that does not exist and so
        # could never fire.
        expr: fn_jobs{state="pending_dispatch"} > 500
        for: 30m
        labels: {severity: ticket, receiver: UNRESOLVED}
        annotations:
          summary: "Work owing dispatch is accumulating"
          action: "Capacity: add a renamer or raise concurrency."

      - alert: FnPublishingStuck
        expr: fn_jobs{state="publishing"} > 0
        for: 30m
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "A job has been mid-publication for 30 minutes"
          description: >-
            Publication commits its receipt and then reveals the document. A
            job that stays in `publishing` has been interrupted between the
            two and needs a redelivery to finish it.
          action: >-
            Check for a renamer that died mid-publication. Recovery completes
            these on redelivery; one that persists needs looking at.

      # --- work that needs a person ----------------------------------------
      - alert: FnUncertainPublicationAppeared
        # `increase` is for counters. fn_jobs is a GAUGE, so the earlier rule
        # was not measuring what it claimed. `delta` is the gauge equivalent.
        expr: delta(fn_jobs{state="uncertain"}[1h]) > 0
        labels: {severity: page, receiver: UNRESOLVED}
        annotations:
          summary: "A new publication could not be confirmed"
          description: >-
            Uncertain is terminal without intervention, deliberately: the
            document may already be with the consumer.
          action: >-
            Follow "Uncertain outcomes" in the operations document. The source
            is preserved. Never bulk-resolve these.

      - alert: FnUncertainBacklogPersists
        expr: fn_jobs{state="uncertain"} > 0
        for: 24h
        labels: {severity: ticket, receiver: UNRESOLVED}
        annotations:
          summary: "Unresolved uncertain publications are outstanding ({{ $value }})"
          description: >-
            EXPECTED TO FIRE until a person resolves them, and it stays firing
            on purpose -- the delta rule above only catches new ones, so
            without this a standing backlog is invisible.
          action: "Resolve them one at a time, by hand."

      - alert: FnHeldWorkAccumulating
        expr: delta(fn_jobs{state="held"}[6h]) > 20
        labels: {severity: ticket, receiver: UNRESOLVED}
        annotations:
          summary: "Held jobs are accumulating"
          action: >-
            Group by failure_category. A rising single category usually means
            one upstream cause.

      # --- capacity ---------------------------------------------------------
      #
      # THE APPLICATION EXPORTS NO FREE-SPACE METRIC. There is no
      # fn_storage_free_bytes, and a rule against one would look like coverage
      # while never firing. Capacity must come from whatever already watches
      # these filesystems at the node level:
      #
      #   - alert: FnStorageNearlyFull
      #     expr: node_filesystem_avail_bytes{mountpoint=~"<incoming|staging|consume>"}
      #           / node_filesystem_size_bytes{...} < 0.10
      #
      # Storage capacity alerting is therefore UNRESOLVED in this package.
