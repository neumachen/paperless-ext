# File Normalizer primary configuration.
#
# Topology: one primary with one asynchronous streaming standby. Asynchronous
# replication is chosen deliberately: a synchronous standby would make every
# commit depend on the standby being up, which is the wrong trade-off for a
# two-node development cluster. The consequence is stated plainly in the
# deployment notes: a primary loss can lose the most recent commits, and there
# is no automatic failover.

listen_addresses = '*'

wal_level = replica
max_wal_senders = 8
max_replication_slots = 8
wal_keep_size = '256MB'
hot_standby = on
hot_standby_feedback = on

# Recovery evidence: a standby that falls far behind must be able to catch up
# from the slot rather than requiring a rebuild.
wal_sender_timeout = '30s'

# Durability. fsync and full_page_writes stay on so a container restart of the
# primary is a real crash-recovery exercise rather than a data-loss shortcut.
fsync = on
synchronous_commit = on
full_page_writes = on

# Predictable, low-noise logging for evidence collection.
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = off
log_disconnections = off
log_replication_commands = on

# Slow-statement logging is useful and is kept, but it must not become a second
# channel for the data the application deliberately keeps out of its own logs.
#
# Job registration binds the original filename, its absolute path and the
# content fingerprint as parameters. PostgreSQL's default would log those bind
# parameter values alongside a slow statement, so a registration that happened
# to take over a second would publish document identity into ordinary database
# logs, bypassing the application's log-key allow-list entirely.
#
# Setting both parameter lengths to 0 disables bind-parameter logging for
# non-error and error statement log messages respectively. The statement text
# is still logged, with $1-style placeholders, so slow queries remain
# diagnosable without their values.
log_min_duration_statement = 1000
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

# No blanket statement logging: that would log every statement including the
# registration INSERT, again with no application-level filtering.
log_statement = 'none'
log_error_verbosity = default
