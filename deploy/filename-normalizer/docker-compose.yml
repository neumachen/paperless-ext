# File Normalizer local foundation stack.
#
# Everything runs in containers: the two applications, the PostgreSQL cluster,
# RabbitMQ, the storage initialiser and the integration-test runner. No host Go
# installation is required.
#
# Isolation. The project name (COMPOSE_PROJECT_NAME, default fnfoundation)
# prefixes every container, network and volume, so `down -v` removes only this
# project's resources and leaves unrelated containers, volumes and development
# data untouched. No database or broker port is published to the host; only the
# applications' HTTP surfaces are, on high ports, so readiness and metrics can
# be inspected from outside the network.

name: ${COMPOSE_PROJECT_NAME:-fnfoundation}

# Settings shared by both applications. Credentials are never inlined: each
# password arrives as a file under /run/secrets.
x-app-env: &app-env
  FN_LOG_LEVEL: ${FN_LOG_LEVEL:-info}
  FN_SHUTDOWN_TIMEOUT: ${FN_SHUTDOWN_TIMEOUT:-20s}

  FN_DB_PRIMARY_HOST: postgres-primary
  FN_DB_PRIMARY_PORT: "5432"
  FN_DB_REPLICA_HOST: postgres-replica
  FN_DB_REPLICA_PORT: "5432"
  FN_DB_REPLICA_REQUIRED: ${FN_DB_REPLICA_REQUIRED:-false}
  FN_DB_NAME: ${FN_DB_NAME:-filename_normalizer}
  FN_DB_USER: ${FN_DB_USER:-fn_app}
  FN_DB_PASSWORD_FILE: /run/secrets/fn_db_password
  FN_DB_SSLMODE: disable

  FN_AMQP_HOST: rabbitmq
  FN_AMQP_PORT: "5672"
  FN_AMQP_VHOST: ${FN_AMQP_VHOST:-filename-normalizer}
  FN_AMQP_USER: ${FN_AMQP_USER:-fn_app}
  FN_AMQP_PASSWORD_FILE: /run/secrets/fn_amqp_password
  FN_AMQP_DELIVERY_LIMIT: ${FN_AMQP_DELIVERY_LIMIT:-5}

  FN_STORAGE_INCOMING: /srv/fn/incoming
  FN_STORAGE_QUEUED: /srv/fn/queued
  FN_STORAGE_STAGING: /srv/fn/staging
  FN_STORAGE_CONSUME: ${FN_STORAGE_CONSUME:-/srv/fn/consume}
  FN_STORAGE_FAILED: /srv/fn/failed
  FN_STORAGE_REQUIRED: "true"

  # The declarative configuration. Everything an operator is expected to tune
  # -- selection patterns, the naming policy, discovery and completion
  # behaviour -- lives here rather than in a dozen environment variables. The
  # variables above still win over it, which is how one instance can be tuned
  # differently from its siblings. Credentials are not in it and cannot be:
  # the schema has no field to hold one.
  #
  # Substitutable so the configuration-change exercise can point the
  # applications at a file of its own instead of rewriting this one. The live
  # configuration is bind-mounted read-only and shared by every service; an
  # exercise that edited it in place would be mutating the thing it is
  # supposed to leave untouched, and a crash mid-exercise would leave the
  # stack running somebody else's test configuration.
  FN_CONFIG_FILE: ${FN_CONFIG_FILE:-/etc/fn/normalizer.json}

  # How old a publication claim must be before another attempt may take it
  # over. Left empty so the application's own default applies; the exercise
  # that has to observe two live attempts at once sets it, because the window
  # is evaluated by the worker CONSIDERING a takeover, not by the one holding
  # the claim. A variable compose does not name here never reaches the
  # container, however carefully the caller exports it.
  FN_PUBLISH_TAKEOVER_AFTER: ${FN_PUBLISH_TAKEOVER_AFTER:-}

x-app-hardening: &app-hardening
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-app-build-args: &app-build-args
  VERSION: ${FN_VERSION:-0.1.0-foundation}
  REVISION: ${FN_REVISION:-unknown}
  BUILD_DATE: ${FN_BUILD_DATE:-unknown}

x-pg-image: &pg-image
  image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73

# Secrets arrive as files, which is what the applications' *_FILE indirection
# expects and what lets the application containers keep a read-only root
# filesystem. `make secrets` writes them from .env; in a real deployment they
# would come from outside the repository entirely.
#
# Permissions. Compose bind-mounts each file and ignores the `uid`, `gid` and
# `mode` keys outside Swarm, so the host file's own mode is what the container
# sees. `make secrets` therefore writes the files 0644 inside a 0700 directory:
# the directory keeps them private on the host, while the file mode lets the
# containers' unprivileged account read the mount, which resolves the path
# without traversing the directory.
secrets:
  fn_db_password:
    file: ./secrets/fn_db_password
  fn_amqp_password:
    file: ./secrets/fn_amqp_password

networks:
  fn:
    driver: bridge

volumes:
  # An alternate destination, used only by the configuration-change exercise so
  # a destination change has a real directory to point at that is not another
  # role's root.
  fn-consume-alt:

  # Two filesystems that are genuinely not the one the named volumes live on,
  # and are still SHAREABLE.
  #
  # A service-level `tmpfs:` mount is private to its container, which is why
  # the disk-full scenario could not say what its failed write left behind and
  # why a tmpfs destination could not be examined at all: the runtime image is
  # FROM scratch, so nothing inside can list a directory, and nothing outside
  # can see it. A tmpfs-backed named volume is a different filesystem by
  # construction AND can be mounted into an inspector container.
  fn-consume-tmpfs:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m
  fn-staging-tiny:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m

  # State for the isolated Paperless instance used as a REAL consumer. It is
  # its own database and its own media store: nothing here touches a real
  # library, and the whole thing is created and destroyed by the exercise.
  paperless-data:
  paperless-media:
  paperless-redis:

  # Cluster state. Separate volumes so the standby can be rebuilt without
  # touching the primary, and vice versa.
  pg-primary-data:
  pg-replica-data:
  rabbitmq-data:
  # Document storage roles, one volume each, so incoming and consume are
  # genuinely distinct filesystems from the containers' point of view.
  fn-incoming:
  fn-queued:
  fn-staging:
  fn-consume:
  fn-failed:

services:
  # -------------------------------------------------------------------------
  # PostgreSQL cluster: one primary with one asynchronous streaming standby.
  # -------------------------------------------------------------------------
  postgres-primary:
    <<: *pg-image
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_DB: ${FN_DB_NAME:-filename_normalizer}
      POSTGRES_USER: ${FN_DB_USER:-fn_app}
      POSTGRES_PASSWORD: ${FN_DB_PASSWORD:?FN_DB_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      FN_REPLICATION_USER: ${FN_REPLICATION_USER:-fn_repl}
      FN_REPLICATION_PASSWORD: ${FN_REPLICATION_PASSWORD:?FN_REPLICATION_PASSWORD must be set in .env}
      FN_REPLICATION_SLOT: ${FN_REPLICATION_SLOT:-fn_standby_1}
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./postgres/primary/postgresql.primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/primary/10-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    networks: [fn]
    healthcheck:
      # Healthy means "accepting connections and not in recovery". A promoted
      # standby answering here would be a misconfiguration, not health.
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -q && PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT NOT pg_is_in_recovery()' | grep -q t
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  postgres-replica:
    <<: *pg-image
    entrypoint: ["/bin/sh", "/usr/local/bin/fn-standby-entrypoint.sh"]
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${FN_DB_USER:-fn_app}
      POSTGRES_DB: ${FN_DB_NAME:-filename_normalizer}
      # Used by the healthcheck's psql only; the base backup authenticates as
      # the replication role from the entrypoint.
      FN_DB_PASSWORD: ${FN_DB_PASSWORD:?FN_DB_PASSWORD must be set in .env}
      FN_PRIMARY_HOST: postgres-primary
      FN_REPLICATION_USER: ${FN_REPLICATION_USER:-fn_repl}
      FN_REPLICATION_PASSWORD: ${FN_REPLICATION_PASSWORD:?FN_REPLICATION_PASSWORD must be set in .env}
      FN_REPLICATION_SLOT: ${FN_REPLICATION_SLOT:-fn_standby_1}
    volumes:
      - pg-replica-data:/var/lib/postgresql/data
      - ./postgres/replica/entrypoint.sh:/usr/local/bin/fn-standby-entrypoint.sh:ro
    networks: [fn]
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      # A standby is healthy when it answers queries while still in recovery.
      # Leaving recovery means it was promoted; that is reported by the
      # application's readiness output rather than silently treated as healthy.
      test:
        - CMD-SHELL
        - pg_isready -q -U "$$FN_REPLICATION_USER" && PGPASSWORD="$$FN_DB_PASSWORD" psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc 'SELECT pg_is_in_recovery()' | grep -q t
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # RabbitMQ: single node, durable topology, quorum queues, persistent
  # messages. Clustering is deliberately out of scope for this increment.
  # -------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine@sha256:0057f1a70160f6cfb9bddbb3e3da91da5dbde4fefbcd6454f7e158d6937fea38
    # A stable hostname keeps the node name stable, which is what lets the
    # persisted quorum-queue state survive a container restart.
    hostname: fn-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${FN_AMQP_USER:-fn_app}
      RABBITMQ_DEFAULT_PASS: ${FN_AMQP_PASSWORD:?FN_AMQP_PASSWORD must be set in .env}
      RABBITMQ_DEFAULT_VHOST: ${FN_AMQP_VHOST:-filename-normalizer}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [fn]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Storage initialiser.
  #
  # Docker creates a fresh named volume owned by root, which the unprivileged
  # applications cannot write. This one-shot service hands each role to the
  # runtime account and generates the synthetic documents used as fixtures. It
  # is the only container in the stack that needs root, and it touches nothing
  # outside this project's volumes.
  # -------------------------------------------------------------------------
  storage-init:
    <<: *pg-image
    entrypoint: ["/bin/sh", "/usr/local/bin/fn-storage-init.sh"]
    user: "0:0"
    environment:
      FN_FIXTURE_COUNT: ${FN_FIXTURE_COUNT:-12}
      FN_RUNTIME_UID: "65532"
      FN_RUNTIME_GID: "65532"
      FN_STORAGE_ROOT: /srv/fn
    volumes:
      - ./scripts/storage-init.sh:/usr/local/bin/fn-storage-init.sh:ro
      - fn-incoming:/srv/fn/incoming
      - fn-queued:/srv/fn/queued
      - fn-staging:/srv/fn/staging
      - fn-consume:/srv/fn/consume
      - fn-consume-alt:/srv/fn/consume-alt
      - fn-consume-tmpfs:/srv/fn/consume-tmpfs
      - fn-staging-tiny:/srv/fn/staging-tiny
      - fn-failed:/srv/fn/failed
    networks: [fn]
    restart: "no"

  # -------------------------------------------------------------------------
  # The watcher application. Hosts dispatch and completion accounting.
  # Discovery is the third worker it is intended to host; it is not
  # implemented, and enabling it is a startup error.
  # -------------------------------------------------------------------------
  watcher:
    <<: *app-hardening
    build:
      context: ../../extensions/filename-normalizer
      dockerfile: Dockerfile
      target: watcher
      args: *app-build-args
    image: ${FN_IMAGE_PREFIX:-filename-normalizer}/watcher:${FN_VERSION:-0.1.0-foundation}
    environment:
      <<: *app-env
      FN_INSTANCE: watcher-1
      FN_DB_APPLY_MIGRATIONS: "true"
      FN_WATCHER_DISPATCH_INTERVAL: ${FN_WATCHER_DISPATCH_INTERVAL:-500ms}
      FN_WATCHER_DISPATCH_BATCH: ${FN_WATCHER_DISPATCH_BATCH:-32}
      FN_WATCHER_DISPATCH_CLAIM_MAX_AGE: ${FN_WATCHER_DISPATCH_CLAIM_MAX_AGE:-30s}
      FN_WATCHER_ACCOUNTING_INTERVAL: ${FN_WATCHER_ACCOUNTING_INTERVAL:-2s}
    secrets: [fn_db_password, fn_amqp_password]
    volumes:
      - ./config:/etc/fn:ro
      - fn-incoming:/srv/fn/incoming:ro
      - fn-queued:/srv/fn/queued
      - fn-staging:/srv/fn/staging
      # Publication belongs to the renamer, so the watcher gets the consumer's
      # directory read-only. The application's probe expects exactly this.
      - fn-consume:/srv/fn/consume:ro
      # Mounted so the watcher can also be pointed at the tmpfs destination for
      # the separate-filesystem scenario: it records the destination a
      # submission is accepted for, so it has to be able to see the one in use.
      - fn-consume-tmpfs:/srv/fn/consume-tmpfs:ro
      - fn-failed:/srv/fn/failed
    ports:
      - "${FN_WATCHER_PORT:-18080}:8080"
    networks: [fn]
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      # The scratch image has no shell, so the healthcheck is the binary's own
      # subcommand in exec form. It queries the *running* process over the HTTP
      # surface that process is serving, so a dead or wedged server fails the
      # check. Running `version` instead would only have proved that a fresh
      # copy of the binary can start.
      #
      # Liveness, not readiness: a dependency outage must leave the container
      # running and reporting not-ready, not be treated as a dead container.
      test: ["CMD", "/usr/local/bin/fn-watcher", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------------------
  # The gRPC inspection client. Run on demand:
  #
  #   docker compose --profile tools run --rm fnctl status
  #   docker compose --profile tools run --rm fnctl preview "Bank Statement.PDF"
  #
  # It joins the application network so it can reach the API, and holds no
  # credentials and no document mounts: everything it can do is read-only.
  # -------------------------------------------------------------------------
  fnctl:
    profiles: [tools]
    build:
      context: ../../extensions/filename-normalizer
      dockerfile: Dockerfile
      target: fnctl
      args: *app-build-args
    image: ${FN_IMAGE_PREFIX:-filename-normalizer}/fnctl:${FN_VERSION:-0.1.0-foundation}
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FN_GRPC_TARGET: ${FN_GRPC_TARGET:-watcher:9090}
    volumes:
      - ./config:/etc/fn:ro
    networks: [fn]

  # -------------------------------------------------------------------------
  # Two independent renamer containers, declared as separate services rather
  # than replicas so each has a stable identity and its own readiness
  # endpoint. Starting two establishes deployment capability; it does not by
  # itself demonstrate concurrent document processing.
  # -------------------------------------------------------------------------
  renamer-1: &renamer
    <<: *app-hardening
    build:
      context: ../../extensions/filename-normalizer
      dockerfile: Dockerfile
      target: renamer
      args: *app-build-args
    image: ${FN_IMAGE_PREFIX:-filename-normalizer}/renamer:${FN_VERSION:-0.1.0-foundation}
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-1
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: ${FN_RENAMER_CONCURRENCY:-2}
    secrets: [fn_db_password, fn_amqp_password]
    volumes:
      - ./config:/etc/fn:ro
      - fn-incoming:/srv/fn/incoming:ro
      - fn-queued:/srv/fn/queued
      - fn-staging:/srv/fn/staging
      - fn-consume:/srv/fn/consume
      - fn-consume-alt:/srv/fn/consume-alt
      - fn-failed:/srv/fn/failed
    ports:
      - "${FN_RENAMER1_PORT:-18081}:8080"
    networks: [fn]
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      # Queries the running process over its own HTTP surface; see the
      # watcher's healthcheck for why `version` is not enough.
      test: ["CMD", "/usr/local/bin/fn-renamer", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  renamer-2:
    <<: *renamer
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-2
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: ${FN_RENAMER_CONCURRENCY:-2}
    ports:
      - "${FN_RENAMER2_PORT:-18082}:8080"

  # -------------------------------------------------------------------------
  # A renamer whose staging root is a tmpfs, so staging and consume are on
  # genuinely different filesystems. Both roots being Docker volumes on one
  # host filesystem is what left A10's cross-filesystem path unexercised; a
  # tmpfs has its own device, which is the real thing rather than two
  # different-looking paths.
  # -------------------------------------------------------------------------
  renamer-altfs:
    <<: *renamer
    profiles: [fault]
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-altfs
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
    volumes:
      - ./config:/etc/fn:ro
      - fn-incoming:/srv/fn/incoming:ro
      - fn-queued:/srv/fn/queued
      - fn-consume:/srv/fn/consume
      - fn-failed:/srv/fn/failed
    tmpfs:
      - /srv/fn/staging:size=64m,mode=1777
    # `ports: []`, not `ports: !reset []`. The !reset tag applies to Compose's
    # multi-file merge, not to a YAML anchor merge, so every fault instance
    # silently kept the anchor's published port -- renamer-1's. They took
    # 18081 in turn, and the one scenario that needs renamer-1 running
    # alongside a fault instance failed to start it, which read as "the
    # sibling never contended for the job" when there was no sibling at all.
    ports: []

  # -------------------------------------------------------------------------
  # The same, with a staging tmpfs far too small for the documents the A11
  # exercise submits. A write that runs out of space mid-copy is a real
  # ENOSPC, not a simulated one.
  # -------------------------------------------------------------------------
  renamer-tinyfs:
    <<: *renamer
    profiles: [fault]
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-tinyfs
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
      FN_RENAMER_MAX_DELIVERY_ATTEMPTS: "2"
    volumes:
      - ./config:/etc/fn:ro
      - fn-incoming:/srv/fn/incoming:ro
      - fn-queued:/srv/fn/queued
      - fn-consume:/srv/fn/consume
      - fn-failed:/srv/fn/failed
      # A 1 MB filesystem that an inspector can also mount, so what the failed
      # write left behind is observable rather than "inside a container-private
      # tmpfs nothing can list".
      - fn-staging-tiny:/srv/fn/staging
    ports: []

  # -------------------------------------------------------------------------
  # A renamer that deliberately dies partway through publishing, so the
  # interruption window between the destination link and the receipt is
  # exercised for real. FN_FAULT_POINTS is inert everywhere else and the
  # application logs loudly when it is armed.
  # -------------------------------------------------------------------------
  renamer-fault:
    <<: *renamer
    profiles: [fault]
    restart: "no"
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-fault
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
      FN_FAULT_POINTS: ${FN_FAULT_POINTS:-after_link}
    ports: []

  # -------------------------------------------------------------------------
  # A renamer that HOLDS its publication claim open instead of dying.
  #
  # Every other way of producing two attempts on one job leaves the first one
  # dead, and a second attempt that only finds an existing receipt proves
  # nothing about competing publication. This instance takes the claim, then
  # sleeps FN_FAULT_HOLD with the claim held and the destination still empty,
  # which is the only state in which a sibling's behaviour is decided by the
  # claim itself rather than by an occupied directory.
  #
  # FN_SHUTDOWN_TIMEOUT is the takeover window: a claim older than this may be
  # taken from a worker presumed dead. It is short here so the exercise can
  # observe both halves -- the sibling standing down while the claim is fresh,
  # and the takeover once it is not -- inside one hold.
  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Two handlers inside ONE process, contending for one job.
  #
  # The overlap that was demonstrated before was between two CONTAINERS, which
  # is the easy direction: their claim holders have different names, so any
  # guard that compares names catches it. Two handlers of one renamer share the
  # instance name, and the recovery path exempted a claim whose holder name
  # matched its own -- so the boundary that held across processes was the one
  # that did not hold inside one. Concurrency 2 with a prefetch of 2 puts both
  # deliveries of a job in the hands of a single process.
  # -------------------------------------------------------------------------
  renamer-same-instance:
    <<: *renamer
    profiles: [fault]
    restart: "no"
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-same-instance
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "2"
      FN_RENAMER_PREFETCH: "2"
      FN_FAULT_POINTS: hold_after_claim
      FN_FAULT_HOLD: ${FN_FAULT_HOLD:-45s}
      FN_PUBLISH_TAKEOVER_AFTER: ${FN_PUBLISH_TAKEOVER_AFTER:-600s}
    ports: []

  # -------------------------------------------------------------------------
  # An ordinary worker with whatever takeover window the exercise gives it, so
  # a STALE holder can actually be taken over inside a run: the accepted stack
  # uses a window far longer than any hold a test can sit through.
  # -------------------------------------------------------------------------
  renamer-taker:
    <<: *renamer
    profiles: [fault]
    restart: "no"
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-taker
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
      FN_PUBLISH_TAKEOVER_AFTER: ${FN_PUBLISH_TAKEOVER_AFTER:-600s}
    ports: []

  renamer-hold:
    <<: *renamer
    profiles: [fault]
    restart: "no"
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-hold
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
      # Substitutable, defaulting to the point this service was added for.
      # Hardcoding it meant an exercise asking for hold_after_link got
      # hold_after_claim without being told, and then measured a sequence that
      # had not happened: the holder paused before its link instead of after it,
      # and the exercise read "a receipt already exists" as a product fault.
      FN_FAULT_POINTS: ${FN_FAULT_POINTS:-hold_after_claim}
      FN_FAULT_HOLD: ${FN_FAULT_HOLD:-90s}
      # Settable, because a paused holder with the default prefetch of 2 holds
      # the duplicate delivery an exercise publishes for a SIBLING to pick up.
      # The sibling then never sees the job, no takeover happens, and the
      # holder eventually wakes and does the work itself -- correct behaviour,
      # and a measurement of nothing.
      FN_RENAMER_PREFETCH: ${FN_RENAMER_PREFETCH:-2}
    # Reset, like every other fault-profile instance. Inheriting the renamer
    # anchor's published port means inheriting renamer-1's: this service would
    # take 18081 and renamer-1 would fail to start with exit 128 -- which
    # looked exactly like "the sibling never contended for the job", because
    # there was no sibling.
    ports: []

  # -------------------------------------------------------------------------
  # A real, isolated Paperless instance, used as a REAL consumer.
  #
  # # Why a real one
  #
  # Two of the guarantees are about what a consumer DOES to a published
  # document: it takes the file out of the consume directory, promptly, and
  # the normalizer must handle the file vanishing between the link and the
  # moment it looks at it. A fake consumer that deletes files on a timer can
  # be made to produce whichever timing makes the test pass, so it proves
  # nothing about the real handoff.
  #
  # # Why this one is safe
  #
  # It is isolated in every way that matters: its own database, its own media
  # volume, its own Redis, no port published to the host, and it consumes only
  # the synthetic documents this stack produces. It has no connection to any
  # real library, and it lives behind its own profile so the ordinary stack
  # never starts it.
  # -------------------------------------------------------------------------
  paperless-redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    profiles: [consumer]
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - paperless-redis:/data
    networks: [fn]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.18.4@sha256:3421ebe06ed27662d014046cf5089e612de853aae0c676a2bc72f73b38080e57
    profiles: [consumer]
    restart: "no"
    depends_on:
      paperless-redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      # ONE account owns the shared directory.
      #
      # The consume root is prepared by storage-init as 0770 owned by the
      # runtime account, and Paperless chowns its consumption directory to its
      # own user when it starts. Left to themselves the two fight over it: the
      # renamer's staging was refused while Paperless owned the directory, and
      # Paperless could not read it once storage-init took it back, so nothing
      # was ever consumed. Mapping Paperless onto the same uid/gid makes its
      # chown a no-op and both able to use the directory -- which is what any
      # real deployment sharing a directory between two services has to do.
      USERMAP_UID: ${FN_RUNTIME_UID:-65532}
      USERMAP_GID: ${FN_RUNTIME_GID:-65532}
      PAPERLESS_REDIS: redis://paperless-redis:6379
      # SQLite, so this instance needs no database of its own and cannot be
      # pointed at the normalizer's cluster by accident.
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_DATA_DIR: /usr/src/paperless/data
      PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
      # The normalizer's destination IS this consumer's inbox. That is the
      # whole handoff, and it is the real thing here rather than a directory
      # nothing watches.
      PAPERLESS_CONSUMPTION_DIR: /usr/src/paperless/consume
      # Documents already in the destination when the exercise starts. They
      # belong to earlier runs: this instance is not asked to consume them,
      # and the exercise does not remove them. Set from the directory itself
      # so it names exactly what was there and cannot match anything this
      # exercise publishes afterwards.
      PAPERLESS_CONSUMER_IGNORE_PATTERNS: ${FN_PAPERLESS_IGNORE:-[]}
      PAPERLESS_CONSUMER_POLLING: ${FN_PAPERLESS_POLL:-1}
      PAPERLESS_CONSUMER_POLLING_DELAY: "1"
      PAPERLESS_CONSUMER_POLLING_RETRY_COUNT: "5"
      # Synthetic fixtures are not real documents; OCR would spend minutes
      # failing to read them and would tell us nothing about the handoff.
      PAPERLESS_OCR_MODE: skip
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_SECRET_KEY: ${FN_PAPERLESS_SECRET:-local-synthetic-only-not-a-deployment-secret}
      PAPERLESS_URL: http://paperless:8000
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - fn-consume:/usr/src/paperless/consume
    # No host port. Nothing outside this stack can reach it, which is part of
    # what makes running it locally acceptable.
    networks: [fn]
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "5", "http://localhost:8000"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  # -------------------------------------------------------------------------
  # A renamer used to produce a REAL permission denial at the publication.
  #
  # The denial cannot simply be configured: a destination that is unwritable
  # at startup makes the application not-ready, so it never attempts the write
  # that is supposed to be refused, and the exercise would prove nothing. So
  # this instance holds its publication claim open instead, and the exercise
  # revokes write on the destination during that window. The link is then
  # refused by the kernel, as the unprivileged account the application really
  # runs as -- which is the part the previous round's root-owned fixture
  # could not show.
  #
  # It uses the ORDINARY consume root, not a private one. Pointing it
  # somewhere else does not work and should not: a job carries the
  # destination it was accepted for, so a renamer configured for a different
  # root correctly refuses it as a destination mismatch and never reaches the
  # write at all. The revocation is therefore brief, happens while this is
  # the only consumer, and is undone on every exit path.
  # -------------------------------------------------------------------------
  renamer-permdenied:
    <<: *renamer
    profiles: [fault]
    restart: "no"
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-permdenied
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
      FN_RENAMER_MAX_DELIVERY_ATTEMPTS: "2"
      FN_FAULT_POINTS: hold_after_claim
      FN_FAULT_HOLD: ${FN_PERM_HOLD:-45s}
    ports: []

  # -------------------------------------------------------------------------
  # A renamer that holds open the window between the successful link and the
  # read-back of the destination, so a REAL consumer can be observed taking
  # the document inside it.
  #
  # The window is otherwise microseconds wide. Paperless watches the directory
  # and ingests on its own schedule, so without the hold it would never win
  # that race, and the only way to "demonstrate" the case would be to delete
  # the file on a timer -- which says nothing about what a consumer does.
  # Holding the window open changes only this instance's timing; the link, the
  # ingestion and the removal are all real.
  # -------------------------------------------------------------------------
  renamer-consume-hold:
    <<: *renamer
    profiles: [consumer]
    restart: "no"
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-consume-hold
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
      FN_FAULT_POINTS: hold_after_link
      FN_FAULT_HOLD: ${FN_CONSUME_HOLD:-150s}
    ports: []

  # -------------------------------------------------------------------------
  # A renamer whose DESTINATION is on a different filesystem from incoming.
  #
  # A10 asks for publication across a real filesystem boundary between the
  # source and the destination. The existing tmpfs-staging service crosses
  # staging/consume, which is the boundary the copy fallback depends on, but it
  # is not the topology the acceptance criterion names. This one publishes into
  # a tmpfs-backed named volume: a genuinely different device from the incoming
  # volume, and still mountable by an inspector, so the published bytes can be
  # compared with the source.
  # -------------------------------------------------------------------------
  renamer-tmpfsdest:
    <<: *renamer
    profiles: [fault]
    restart: "no"
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-tmpfsdest
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
      FN_STORAGE_CONSUME: /srv/fn/consume-tmpfs
    volumes:
      - ./config:/etc/fn:ro
      - fn-incoming:/srv/fn/incoming:ro
      - fn-queued:/srv/fn/queued
      - fn-staging:/srv/fn/staging
      - fn-consume-tmpfs:/srv/fn/consume-tmpfs
      - fn-failed:/srv/fn/failed
    ports: []

  # -------------------------------------------------------------------------
  # A renamer in dry-run mode, for the A9 demonstration. It consumes the same
  # real queue as its siblings, so `make test-dry-run` stops them first: the
  # point is to show what a dry run does NOT do, which only means anything if
  # it is the only consumer.
  # -------------------------------------------------------------------------
  renamer-dry-run:
    <<: *renamer
    profiles: [fault]
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-dry-run
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_RENAMER_CONCURRENCY: "1"
      FN_RENAMER_DRY_RUN: "true"
      FN_GRPC_ADDR: ":9090"
    ports: []

  # -------------------------------------------------------------------------
  # A watcher whose incoming root was never mounted.
  #
  # Its database and broker are the healthy ones, so storage is the only thing
  # that can be at fault. F5 uses it to show that unavailable storage produces
  # a truthful not-ready application rather than a process that reads the root
  # as empty. It lives behind its own profile so it is not part of the normal
  # stack.
  # -------------------------------------------------------------------------
  watcher-storage-fault:
    <<: *app-hardening
    restart: "no"
    build:
      context: ../../extensions/filename-normalizer
      dockerfile: Dockerfile
      target: watcher
      args: *app-build-args
    image: ${FN_IMAGE_PREFIX:-filename-normalizer}/watcher:${FN_VERSION:-0.1.0-foundation}
    environment:
      <<: *app-env
      FN_INSTANCE: watcher-storage-fault
      FN_DB_APPLY_MIGRATIONS: "false"
      # This path is deliberately not mounted.
      FN_STORAGE_INCOMING: /srv/fn/never-mounted
      FN_WATCHER_DISPATCH_INTERVAL: 5s
      FN_WATCHER_ACCOUNTING_INTERVAL: 5s
    secrets: [fn_db_password, fn_amqp_password]
    volumes:
      - ./config:/etc/fn:ro
      - fn-queued:/srv/fn/queued
      - fn-staging:/srv/fn/staging
      - fn-consume:/srv/fn/consume:ro
      - fn-failed:/srv/fn/failed
    networks: [fn]
    profiles: [fault]

  # -------------------------------------------------------------------------
  # A renamer pointed at a reachable database that has no ledger schema.
  #
  # It connects to the "postgres" maintenance database, which exists and
  # authenticates but has never had a migration applied, with migrations
  # disabled. F4 uses it to show that connectivity is not readiness: a
  # reachable database whose migration never ran must produce a truthful
  # not-ready application rather than one that advertises itself as ready and
  # then fails on its first durable write. Its own profile keeps it out of the
  # normal stack.
  # -------------------------------------------------------------------------
  renamer-no-schema:
    <<: *app-hardening
    restart: "no"
    build:
      context: ../../extensions/filename-normalizer
      dockerfile: Dockerfile
      target: renamer
      args: *app-build-args
    image: ${FN_IMAGE_PREFIX:-filename-normalizer}/renamer:${FN_VERSION:-0.1.0-foundation}
    environment:
      <<: *app-env
      FN_INSTANCE: renamer-no-schema
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_DB_NAME: postgres
      FN_RENAMER_CONCURRENCY: "1"
    secrets: [fn_db_password, fn_amqp_password]
    volumes:
      - ./config:/etc/fn:ro
      - fn-incoming:/srv/fn/incoming:ro
      - fn-queued:/srv/fn/queued
      - fn-staging:/srv/fn/staging
      - fn-consume:/srv/fn/consume
      - fn-failed:/srv/fn/failed
    networks: [fn]
    profiles: [fault]

  # -------------------------------------------------------------------------
  # Readiness sampler.
  #
  # Runs the renamer binary purely for its `probe` subcommand, and mounts the
  # evidence directory so it can append observations. The application services
  # deliberately do not mount evidence, and a scratch image has no wget, so the
  # sampling needs its own service rather than an entrypoint override.
  #
  # It exists because /readyz answers 503 while an instance drains, and busybox
  # wget discards the body of a non-2xx response — the readiness document
  # during a drain is exactly what has to be captured.
  # -------------------------------------------------------------------------
  readiness-probe:
    build:
      context: ../../extensions/filename-normalizer
      dockerfile: Dockerfile
      target: renamer
      args: *app-build-args
    image: ${FN_IMAGE_PREFIX:-filename-normalizer}/renamer:${FN_VERSION:-0.1.0-foundation}
    entrypoint: ["/usr/local/bin/fn-renamer"]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    volumes:
      - ../../extensions/filename-normalizer/.evidence:/evidence
    networks: [fn]
    profiles: [test]

  # -------------------------------------------------------------------------
  # Integration-test runner. Built from the same source tree and linked
  # against the same packages as the applications, so the suite exercises the
  # applications' real integration code rather than the stock images.
  #
  # It runs as root only so it can construct the permission-denied storage
  # fixture F5 requires, and it writes only into this project's volumes.
  # -------------------------------------------------------------------------
  integration:
    build:
      context: ../../extensions/filename-normalizer
      dockerfile: Dockerfile
      target: integration
      args: *app-build-args
    image: ${FN_IMAGE_PREFIX:-filename-normalizer}/integration:${FN_VERSION:-0.1.0-foundation}
    environment:
      <<: *app-env
      FN_INSTANCE: integration
      FN_DB_APPLY_MIGRATIONS: "false"
      FN_TEST_PHASE: ${FN_TEST_PHASE:-baseline}
      FN_TEST_WATCHER_URL: http://watcher:8080
      FN_TEST_RENAMER_URLS: http://renamer-1:8080,http://renamer-2:8080
      FN_TEST_FAULT_URL: http://watcher-storage-fault:8080
      FN_TEST_RABBITMQ_MGMT_URL: http://rabbitmq:15672
      # Must match log_min_duration_statement in the primary's configuration.
      FN_TEST_SLOW_STATEMENT_MS: "1000"
      FN_TEST_NO_SCHEMA_URL: http://renamer-no-schema:8080
      FN_TEST_EVIDENCE_DIR: /evidence
    secrets: [fn_db_password, fn_amqp_password]
    volumes:
      - ./config:/etc/fn:ro
      - fn-incoming:/srv/fn/incoming
      - fn-queued:/srv/fn/queued
      - fn-staging:/srv/fn/staging
      - fn-consume:/srv/fn/consume
      - fn-failed:/srv/fn/failed
      - ../../extensions/filename-normalizer/.evidence:/evidence
    networks: [fn]
    profiles: [test]
    restart: "no"
